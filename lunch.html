<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dagens lunch</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lunch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f4f0; --card: #ffffff; --text: #1f1d1a; --muted: #6b665e;
    --line: #e4dfd6; --accent: #b4532a; --warn-bg: #fff3d6; --warn: #7a5300;
    --err-bg: #fde4e1; --err: #9b2c1f;
    --meat-bg: #f9dfd9; --meat: #8e2a1b; --fish-bg: #dbe9f7; --fish: #1d4f86;
    --veg-bg: #dcefd9; --veg: #2d6427;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --card: #22201d; --text: #ece8e1; --muted: #a39d93;
      --line: #36322d; --accent: #e08a5f; --warn-bg: #3a2f14; --warn: #f0cf7a;
      --err-bg: #3d1f1b; --err: #f2a397;
      --meat-bg: #4a221c; --meat: #f4b0a3; --fish-bg: #1c3149; --fish: #a9cdf2;
      --veg-bg: #213a1f; --veg: #acdba4;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .page {
    max-width: 1000px; margin: 0 auto;
    /* the safe areas keep the page clear of the notch when opened from the home screen */
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
      max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .actions { display: flex; gap: 8px; }
  #panel-toggle[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .active-count {
    display: inline-block; margin-left: 6px; min-width: 1.4em; padding: 0 5px; border-radius: 999px;
    background: var(--accent); color: var(--card); font-size: .75rem; font-weight: 600; text-align: center;
  }
  aside {
    flex: 0 0 240px; position: sticky; top: 24px; margin-top: 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  aside h2 { margin: 0 0 8px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  aside label { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  aside input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .filter-actions { display: flex; gap: 6px; margin-top: 10px; }
  .filter-actions button { padding: 3px 10px; font-size: .85rem; }
  aside h2.second { margin-top: 18px; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row select, .row #url {
    flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 4px 6px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .row button { padding: 3px 10px; font-size: .85rem; }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: .85rem; margin-top: 6px; min-height: 1em; }
  #save-file { margin-top: 6px; padding: 3px 10px; font-size: .85rem; }
  .star {
    flex: none; align-self: flex-start; border: 0; background: none; padding: 0 2px; margin-top: -2px;
    font-size: 1.25rem; line-height: 1.4; color: var(--muted); cursor: pointer;
  }
  .star:hover, li.favorite .star { color: var(--accent); }
  li.favorite .name { color: var(--accent); }
  .keywords { display: none; margin-top: 2px; font-size: .8rem; color: var(--muted); font-style: italic; }
  body.show-keywords .keywords { display: block; }
  aside label.option { margin-top: 6px; font-size: .9rem; }
  .keyword-details { margin-top: 4px; font-size: .8rem; color: var(--muted); }
  .keyword-details summary { cursor: pointer; font-size: .9rem; color: var(--text); padding: 3px 0; }
  .keyword-details p { margin: 6px 0; line-height: 1.5; }
  .count { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  section.favorites { border-color: var(--accent); }
  main { flex: 1; min-width: 0; }
  .badges { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; vertical-align: 2px; }
  aside .badges { margin-left: 0; }
  .badge { font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .badge-meat { background: var(--meat-bg); color: var(--meat); }
  .badge-fish { background: var(--fish-bg); color: var(--fish); }
  .badge-veg { background: var(--veg-bg); color: var(--veg); }
  .empty { color: var(--muted); margin-top: 18px; }
  @media (max-width: 640px) {
    .layout { flex-direction: column; align-items: stretch; gap: 0; }
    aside { position: static; flex: none; }
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.8rem; }
  #today { color: var(--muted); }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  section {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-top: 18px;
  }
  section h2 { margin: 0; font-size: 1.25rem; }
  section h2 a { color: inherit; text-decoration: none; }
  section h2 a:hover { color: var(--accent); }
  .meta { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .note { margin-top: 10px; padding: 6px 10px; border-radius: 6px; font-size: .9rem; background: var(--warn-bg); color: var(--warn); }
  .error { background: var(--err-bg); color: var(--err); }
  .group { margin: 14px 0 4px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  .dish { flex: 1; min-width: 0; }
  .cat { font-size: .75rem; font-weight: 600; letter-spacing: .05em; color: var(--accent); text-transform: uppercase; }
  .name { font-weight: 600; }
  .desc { color: var(--muted); }
  .price { white-space: nowrap; font-weight: 600; }
  .loading { color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="page">
<header>
  <div>
    <h1>Dagens lunch</h1>
    <div id="today"></div>
  </div>
  <div class="actions">
    <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel">
      Filter<span id="filter-active" class="active-count" hidden></span>
    </button>
    <button id="reload" type="button">Uppdatera</button>
  </div>
</header>
<div class="layout">
<aside id="panel" hidden>
  <h2>Restauranger</h2>
  <div id="filter"></div>
  <div class="filter-actions">
    <button id="all" type="button">Alla</button>
    <button id="none" type="button">Inga</button>
  </div>
  <h2 class="second">Kategori</h2>
  <div id="category-filter"></div>
  <label class="option"><input id="show-keywords" type="checkbox"> Visa nyckelord</label>
  <details class="keyword-details">
    <summary>Alla nyckelord</summary>
    <div id="keyword-list"></div>
  </details>
  <h2 class="second">Hantera</h2>
  <div class="row">
    <select id="restaurant-select" aria-label="Restaurang"></select>
    <button id="delete" type="button">Ta bort</button>
  </div>
  <form id="add-form" class="row">
    <input id="url" type="text" inputmode="url" placeholder="Webbadress" aria-label="Webbadress till lunchmenyn">
    <button id="add" type="submit">Lägg till</button>
  </form>
  <div id="add-status" class="status" aria-live="polite"></div>
  <div id="file-status" class="status" aria-live="polite"></div>
  <button id="save-file" type="button" hidden>Spara till fil</button>
</aside>
<main>
  <section id="favorites" class="favorites" hidden></section>
  <div id="restaurants"></div>
  <div id="empty" class="empty" hidden>Ingen restaurang vald.</div>
</main>
</div>
</div>

<script src="restaurants.js"></script>
<script>
// Pages are fetched through a proxy, since the restaurants' sites do not allow cross-origin
// requests from a local file. The first proxy that answers is used.
// jina: r.jina.ai, which can also run the page's JavaScript (see SITES, text).
const PROXIES = [
  { url: u => "https://r.jina.ai/" + u, headers: { "X-Return-Format": "html" }, jina: true },
  { url: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) },
  { url: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) },
];

// Used when restaurants.js is missing, and for the names of these sites when they are added again.
const DEFAULT_RESTAURANTS = [
  { name: "Ngon", url: "https://ngonrestaurang.se/dagen-lunch/" },
  { name: "Operagrillen", url: "https://www.malmoopera.se/mat-och-dryck/lunch-i-operagrillen" },
  { name: "Cafe Feed", url: "https://www.cafefeed.se/" },
  { name: "La Bonne Vie", url: "https://labonnevie.se/lunchmeny" },
  { name: "Osteria di La", url: "https://osteriadila.se/" },
  { name: "Green Mango", url: "https://www.greenmango.se/lunch" },
];

// Pages with their own parser, by URL; other pages use parseGeneric.
// days: weekdays with lunch (1 = Monday .. 7 = Sunday), null when unknown.
// parse(doc) returns { period, info, groups: [{ title, items: [{ category, name, desc, price }] }] }.
// text: the page builds its menu with JavaScript; r.jina.ai runs it with these headers and
// returns the page as Markdown (HTML from its browser engine needs an API key), and parse gets that text.
const SITES = {
  "https://ngonrestaurang.se/dagen-lunch/": { days: [1, 2, 3, 4, 5], parse: parseNgon },
  "https://www.malmoopera.se/mat-och-dryck/lunch-i-operagrillen": { days: [2, 3, 4, 5], parse: parseOperagrillen },
  "https://www.cafefeed.se/": {
    days: [1, 2, 3, 4, 5],
    parse: parseCafeFeed,
    text: { "X-Engine": "browser", "X-No-Cache": "true", "X-Wait-For-Selector": "#week_num", "X-Timeout": "30" },
  },
  "https://labonnevie.se/lunchmeny": { days: [1, 2, 3, 4, 5], parse: parseBonneVie },
  "https://osteriadila.se/": { days: [1, 2, 3, 4, 5], parse: parseOsteria, load: loadOsteria },
  "https://www.greenmango.se/lunch": { days: [1, 2, 3, 4, 5], parse: parseGreenMango },
};

function siteFor(r) {
  return SITES[r.url] || { days: null, parse: parseGeneric };
}

// Text of an element split into lines at <br> and block boundaries.
function lines(el) {
  const copy = el.cloneNode(true);
  copy.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
  return copy.textContent.split("\n").map(clean).filter(Boolean);
}

function clean(s) {
  return s.replace(/ /g, " ").replace(/\s+/g, " ").trim();
}

function formatPrice(s) {
  s = clean(s);
  return /^\d+$/.test(s) ? s + " kr" : s.replace(/(\d)\s*(kr|:-)/gi, "$1 kr");
}

const isPrice = s => /^[\d\s.,\/–-]*\d[\d\s.,\/–-]*(kr|:-)?([\s\/]*\d+\s*(kr|:-)?)*$/i.test(s);
const isUpper = s => /\p{L}/u.test(s) && s === s.toUpperCase();

function parseNgon(doc) {
  const headings = [...doc.querySelectorAll("h1, h2, h3")];
  const week = headings.map(h => clean(h.textContent).match(/VECKA\s*(\d+)/i)).find(Boolean);
  const hours = clean(doc.body.textContent).match(/VARDAGAR KL [\d.:]+\s*[-–]\s*[\d.:]+/i);
  const items = [];
  for (const h of headings) {
    const label = clean(h.textContent);
    if (!/^VAL\s*\d+$/i.test(label)) {
      continue;
    }
    const box = h.closest(".e-con") || h.parentElement.parentElement.parentElement;
    const price = [...box.querySelectorAll("h1, h2, h3")].map(e => clean(e.textContent)).find(isPrice);
    const text = box.querySelector("p");
    const all = text ? lines(text) : [];
    const nameLines = [];
    while (all.length && isUpper(all[0])) {
      nameLines.push(all.shift());
    }
    items.push({
      category: label,
      name: nameLines.join(" ") || all.shift() || "",
      desc: all.join(" "),
      price: price ? formatPrice(price) : "",
    });
  }
  return {
    week: week ? Number(week[1]) : null,
    period: week ? "Vecka " + week[1] : "",
    info: "Inkl. sallad & måltidsdryck" + (hours ? " · " + hours[0].replace(/^VARDAGAR KL/i, "vardagar kl") : ""),
    groups: [{ title: "", items }],
  };
}

function parseOperagrillen(doc) {
  const intro = [...doc.querySelectorAll("p")].map(p => clean(p.textContent)).find(t => /Lunch serveras/i.test(t));
  const groups = [];
  let period = "";
  for (const block of doc.querySelectorAll(".paragraph--type--menu-food-drink")) {
    const tag = block.querySelector(".tag");
    const title = tag ? clean(tag.textContent) : "";
    const items = [];
    for (const p of block.querySelectorAll(".prose p")) {
      const strong = p.querySelector("strong");
      const category = strong ? clean(strong.textContent) : "";
      const all = lines(p);
      if (category && all.length && all[0].startsWith(category)) {
        all[0] = clean(all[0].slice(category.length));
      }
      const prices = all.filter(isPrice);
      const text = all.filter(l => !isPrice(l));
      if (!prices.length || !text.length) {
        continue;
      }
      items.push({ category, name: text[0], desc: text.slice(1).join(" "), price: prices.map(formatPrice).join(" ") });
    }
    if (/lunchmeny/i.test(title)) {
      period = title.replace(/^Veckans lunchmeny\s*/i, "");
      groups.unshift({ title: "Veckans lunch", items });
    } else if (items.length) {
      groups.push({ title, items });
    }
  }
  return { period, info: intro ? intro.replace(/\.(?=\p{Lu})/gu, ". ") : "", groups };
}

const WEEKDAYS = ["söndag", "måndag", "tisdag", "onsdag", "torsdag", "fredag", "lördag"];
const PRICE = /(\d{2,4}(?:[.,]\d{2})?)\s*(?:kr|:-|sek)\b\.?/gi;
const SKIPPED = "script, style, noscript, template, svg, nav, header, footer, form, button, select, iframe";
const BLOCKS = new Set(["P", "DIV", "LI", "TR", "TD", "TH", "H1", "H2", "H3", "H4", "H5", "H6", "SECTION",
  "ARTICLE", "UL", "OL", "TABLE", "DL", "DT", "DD", "BLOCKQUOTE", "BR", "HR", "MAIN", "ASIDE"]);

// The visible text of a page as lines, split at <br> and block elements.
function pageLines(doc) {
  const body = doc.body.cloneNode(true);
  body.querySelectorAll(SKIPPED).forEach(e => e.remove());
  let text = "";
  const walk = node => {
    if (node.nodeType === Node.TEXT_NODE) {
      text += node.textContent;
      return;
    }
    const block = BLOCKS.has(node.nodeName);
    if (block) {
      text += "\n";
    }
    node.childNodes.forEach(walk);
    if (block) {
      text += "\n";
    }
  };
  walk(body);
  return text.split("\n").map(clean).filter(Boolean);
}

const startsWithWeekday = line => WEEKDAYS.some(d => line.toLowerCase().startsWith(d));

// Best effort for pages without their own parser. If the page has a heading for today
// ("Onsdag", "Onsdag 28/10"), every line under it is a dish; otherwise every line with a
// price is one (with the line before it as the name when the line holds only the price).
function parseGeneric(doc) {
  const all = pageLines(doc);
  const today = WEEKDAYS[new Date().getDay()];
  const start = all.findIndex(l => l.toLowerCase().startsWith(today) && l.length < 40);
  const items = [];
  if (start >= 0) {
    for (let i = start + 1; i < all.length && !startsWithWeekday(all[i]) && items.length < 15; i++) {
      const prices = all[i].match(PRICE) || [];
      const name = clean(all[i].replace(PRICE, "").replace(/^[\s.:–-]+|[\s.:–-]+$/g, ""));
      if (name && name.length < 250) {
        items.push({ name, desc: "", price: prices.map(formatPrice).join(" ") });
      }
    }
    return { period: all[start], info: "", groups: [{ title: "", items }] };
  }
  all.forEach((line, i) => {
    const prices = line.match(PRICE);
    if (!prices || line.length > 250) {
      return;
    }
    let name = clean(line.replace(PRICE, "").replace(/^[\s.:–-]+|[\s.:–-]+$/g, ""));
    if (!/\p{L}{2}/u.test(name) && i > 0 && !all[i - 1].match(PRICE)) {
      name = all[i - 1];
    }
    if (/\p{L}{2}/u.test(name) && name.length < 250) {
      items.push({ name, desc: "", price: prices.map(formatPrice).join(" ") });
    }
  });
  return { period: "", info: "Tolkad automatiskt; kontrollera på sidan.", groups: [{ title: "", items }] };
}

const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);

// Markdown from r.jina.ai: "### Onsdag" followed by the dish of that day.
function parseCafeFeed(text) {
  const all = text.split("\n").map(clean).filter(Boolean);
  const week = text.match(/LUNCH MENY\s*\(v\.\s*(\d+)\)/i);
  const price = text.match(/\((\d+)\s*kr\)/i);
  const hours = text.match(/serveras mellan kl\s*([\d.:]+\s*-\s*[\d.:]+)/i);
  const days = [];
  all.forEach((line, i) => {
    const heading = line.match(/^[*-]?\s*#{1,6}\s*(\p{L}+)$/u);
    const day = heading ? WEEKDAYS.indexOf(heading[1].toLowerCase()) : -1;
    if (day >= 1 && day <= 5 && all[i + 1] && !all[i + 1].match(/^[*-]?\s*#/)) {
      days.push({ day: WEEKDAYS[day], category: heading[1], name: all[i + 1], desc: "",
        price: price ? price[1] + " kr" : "" });
    }
  });
  const today = days.filter(d => d.day === WEEKDAYS[new Date().getDay()]);
  return {
    week: week ? Number(week[1]) : null,
    period: week ? "Vecka " + week[1] : "",
    info: hours ? "Kl " + hours[1] : "",
    groups: [{ title: "", items: today.length ? today : days }],
  };
}

// The weekdays (1 = Monday .. 7 = Sunday) named in a label such as "Måndag - Onsdag" or "Fredag";
// null when it names none.
function dayRange(label) {
  const names = label.toLowerCase().match(/\p{L}+/gu) || [];
  const days = names.map(n => WEEKDAYS.indexOf(n)).filter(d => d >= 0).map(d => d || 7);
  if (!days.length) {
    return null;
  }
  if (days.length === 2 && /[-–]/.test(label)) {
    const range = [];
    for (let d = days[0]; d <= days[1]; d++) {
      range.push(d);
    }
    return range;
  }
  return days;
}

// The lunch is in .lab-menu--lw; the à la carte below it (.lab-menu--other) is skipped.
// Dishes for other days of the week ("Torsdag - Fredag") are left out, except on days without lunch.
function parseBonneVie(doc) {
  const header = [...doc.querySelectorAll(".lab-menus--header p")].map(p => clean(p.textContent));
  const week = header.map(t => t.match(/^v\.?\s*(\d+)$/i)).find(Boolean);
  const all = [...doc.querySelectorAll(".lab-menu--lw .lab-menu-item")].map(item => {
    const label = item.querySelector(".lab-menu-item--name__item");
    const price = item.querySelector(".lab-menu-item--price");
    const parts = [...item.querySelectorAll(".lab-menu-item--meals__item span")].map(s => clean(s.textContent));
    const category = label ? clean(label.textContent) : "";
    return {
      days: dayRange(category),
      category,
      name: parts[0] || "",
      desc: parts.slice(1).join(", "),
      price: price ? formatPrice(price.textContent) : "",
    };
  });
  const today = new Date().getDay() || 7;
  const items = all.filter(i => !i.days || i.days.includes(today));
  return {
    week: week ? Number(week[1]) : null,
    period: week ? "Vecka " + week[1] : "",
    info: header.filter(t => !/^v\.?\s*\d+$/i.test(t)).join(" · ").replace(/\s*\/\/\s*/g, " kl "),
    groups: [{ title: "", items: items.some(i => i.days) ? items : all }],
  };
}

// The lunch menu is a PDF with a new address every week ("...lunchV44.pdf"), linked from the
// home page. r.jina.ai returns the PDF's text as Markdown.
async function loadOsteria(url) {
  const home = await fetchProxied(url);
  const link = [...home.querySelectorAll("a[href]")].map(a => a.getAttribute("href"))
    .find(href => /lunch.*\.pdf$/i.test(href));
  if (!link) {
    throw new Error("hittade ingen lunchmeny (PDF) på sidan");
  }
  return fetchProxied(new URL(link, url).href.replace(/^http:/, "https:"), { "X-No-Cache": "true" });
}

// The PDF's text: section headings in capitals (PASTA, FISK), then per dish a name line and
// description lines, the last ending with the price ("145:-"). The drinks follow "# V.44".
function parseOsteria(text) {
  const all = text.split("\n").map(clean).filter(Boolean);
  const hours = all.map(l => l.match(/^>?\s*(Måndag\s*-\s*Fredag\s*[\d.:]+\s*-\s*[\d.:]+)/i)).find(Boolean);
  const start = all.findIndex(l => /^#*\s*LUNCHMENY/i.test(l));
  const items = [];
  let week = null;
  let category = "";
  let dish = null;
  for (const line of all.slice(start + 1)) {
    const weekLine = line.match(/^#*\s*V\.?\s*(\d+)$/i);
    if (weekLine) {
      week = Number(weekLine[1]);
      break;
    }
    if (line.startsWith(">")) {
      continue;
    }
    if (isUpper(line) && !line.match(PRICE) && line.length < 30) {
      category = line;
      dish = null;
      continue;
    }
    if (!category) {
      continue;
    }
    const price = line.match(/(\d+)\s*:-\s*$/);
    const rest = clean(line.replace(/(\d+)\s*:-\s*$/, ""));
    if (!dish) {
      dish = { category, name: rest, desc: "", price: "" };
    } else if (rest) {
      dish.desc = clean(dish.desc + " " + rest);
    }
    if (price) {
      dish.price = price[1] + " kr";
      items.push(dish);
      dish = null;
    }
  }
  const buffet = /salladsbuff/i.test(text) ? "Salladsbuffé, bröd och vatten ingår" : "";
  return {
    week,
    period: week ? "Vecka " + week : "",
    info: [hours ? hours[1].replace(/\s*-\s*/g, "–") : "", buffet].filter(Boolean).join(" · "),
    groups: [{ title: "", items }],
  };
}

// A menu per weekday: "MÅNDAG", then per dish "1: KENG PED", a description, the price
// (or variants: "Tofu", "135 kr", "Biff", "139 kr") and the spice level. "KOMBOLUNCH" (two dishes
// for one price) is an offer, not a dish; it goes in the info. The drinks ("Cola | ...") end the menu.
function parseGreenMango(doc) {
  const all = pageLines(doc);
  const info = all.find(l => /^Lunch från/i.test(l)) || "";
  const days = [];
  let day = null;
  let dish = null;
  let variant = "";
  for (const line of all) {
    const weekday = WEEKDAYS.indexOf(line.toLowerCase());
    if (weekday >= 1 && weekday <= 5) {
      day = { day: weekday, name: capitalize(line.toLowerCase()), items: [] };
      days.push(day);
      dish = null;
      continue;
    }
    if (!day) {
      continue;
    }
    if (/^(Cola\b|Observera)/i.test(line)) {
      break;
    }
    const start = line.match(/^\d+\s*:\s*(.+)$/);
    if (start) {
      dish = /kombo/i.test(start[1]) ? null : { category: "", name: start[1], desc: "", price: "" };
      if (dish) {
        day.items.push(dish);
      }
      variant = "";
      continue;
    }
    if (!dish) {
      continue;
    }
    if (line.match(PRICE)) {
      dish.price = [dish.price, [variant, formatPrice(line)].filter(Boolean).join(" ")].filter(Boolean).join(" / ");
      variant = "";
    } else if (/^(mild|medium|stark)$/i.test(line)) {
      dish.desc = clean(dish.desc + " Styrka: " + line.toLowerCase() + ".");
    } else if (!dish.desc) {
      dish.desc = line;
    } else if (line.length < 20) {
      variant = line;
    }
  }
  const today = days.find(d => d.day === (new Date().getDay() || 7));
  const shown = today ? [today] : days;
  return {
    period: today ? today.name : "",
    info: info.replace(/\s*\|\s*/g, " · ").replace(/\s*Måndagar\s*-\s*Fredagar:/i, " · Mån–fre"),
    groups: shown.map(d => ({ title: today ? "" : d.name, items: d.items })),
  };
}

// Fetched pages, by URL, until "Uppdatera" is clicked.
const documents = new Map();

function fetchDocument(url) {
  if (!documents.has(url)) {
    const promise = fetchFresh(url);
    promise.catch(() => documents.delete(url));
    documents.set(url, promise);
  }
  return documents.get(url);
}

// Returns the page as a document, or as Markdown text for a site with text headers;
// a site with load fetches its menu itself.
function fetchFresh(url) {
  const site = SITES[url];
  return site && site.load ? site.load(url) : fetchProxied(url, site && site.text);
}

// text: headers for r.jina.ai, which then returns Markdown text instead of a document.
async function fetchProxied(url, text) {
  let lastError = new Error("ingen proxy");
  for (const proxy of PROXIES) {
    if (text && !proxy.jina) {
      continue;
    }
    try {
      const response = await fetch(proxy.url(url), { headers: text || proxy.headers || {}, cache: "no-store" });
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      const body = await response.text();
      return text ? body : new DOMParser().parseFromString(body, "text/html");
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError;
}

// ISO 8601 week number.
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  return Math.ceil(((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) {
    e.className = cls;
  }
  if (text) {
    e.textContent = text;
  }
  return e;
}

const CATEGORIES = [
  { id: "meat", label: "Meat" },
  { id: "fish", label: "Fish" },
  { id: "veg", label: "Vegetarian/Vegan" },
];

// Swedish keywords, matched as parts of words (so "kalvköttbullar" matches "kött").
const KEYWORDS = {
  meat: ["kött", "fläsk", "biff", "kyckling", "kalv", "oxfilé", "lamm", "bacon", "skinka", "korv",
    "anka", "ankbröst", "kalkon", "högrev", "färs", "kålpudding", "kåldolm", "pytt", "entrecote", "gris", "vilt", "hjort", "älg", "renskav",
    "chorizo", "pancetta", "salsiccia", "prosciutto", "kebab", "schnitzel", "wallenberg", "pulled pork"],
  fish: ["fisk", "lax", "torsk", "sej", "kolja", "räk", "tonfisk", "sill", "strömming", "skaldjur", "mussl",
    "kräft", "hummer", "gös", "abborre", "rödspätta", "sjötunga", "röding", "makrill", "bläckfisk",
    "krabb", "pilgrim", "scampi", "hälleflundra", "ostron", "kaviar", "löjrom", "sardell", "ansjovis",
    "kummel", "pesce"],
  veg: ["vegan", "vegetar", "vego", "tofu", "halloumi", "svamp", "portobello", "bönor", "linser", "kikärt",
    "falafel", "mozzarella", "fetaost", "hummus", "quorn", "anamma", "oumph", "soja", "aubergine",
    "grönsak", "pumpa", "spenat", "paneer", "tempeh", "seitan", "ost", "blomkål", "vårrull"],
};
// Words that make a dish vegetarian even if a meat word appears ("sojakött", "Anamma färs").
const VEG_PRODUCTS = ["vegan", "vegetar", "vego", "anamma", "oumph", "quorn", "planted", "sojakött", "tofu",
  "grönsaksbiff"];
// Removed from the text before matching: sauces that do not make a dish a fish dish, and words
// that contain a keyword by accident ("färska örter": färs, "rostade": ost).
const IGNORED_WORDS = ["ostronsås", "fisksås", "färsk", "rostad"];
const IGNORED = new RegExp(IGNORED_WORDS.join("|"), "g");

// The restaurant's own label decides first (Operagrillen: KÖTT, FISK, VEGETARISK, VEGANSK).
const LABELS = { meat: /kött|meat/, fish: /fisk|skaldjur|fish/, veg: /veg/ };

// Returns the category ids of a dish, usually one, several when the guest chooses
// ("med kyckling, räkor eller halloumi"), none when nothing is recognised, and per id the
// words that decided it ({ cats, reasons }).
function categorizeWithReasons(item) {
  const label = (item.category || "").toLowerCase();
  for (const c of CATEGORIES) {
    if (LABELS[c.id].test(label)) {
      return { cats: [c.id], reasons: { [c.id]: ["märkt " + clean(item.category)] } };
    }
  }
  const text = (item.name + " " + item.desc).toLowerCase().replace(IGNORED, "");
  const matching = words => words.filter(w => text.includes(w));
  const reasons = {};
  CATEGORIES.forEach(c => {
    const words = matching(KEYWORDS[c.id]);
    if (words.length) {
      reasons[c.id] = words;
    }
  });
  const found = Object.keys(reasons);
  const pick = cats => ({ cats, reasons: Object.fromEntries(cats.map(id => [id, reasons[id]])) });
  if (/\beller\b/.test(text)) {
    return pick(found);
  }
  const vegProducts = matching(VEG_PRODUCTS);
  if (vegProducts.length) {
    return { cats: ["veg"], reasons: { veg: vegProducts } };
  }
  const animal = found.filter(id => id !== "veg");
  return pick(animal.length ? animal : found);
}

function categorize(item) {
  return categorizeWithReasons(item).cats;
}

const categoryLabel = id => CATEGORIES.find(c => c.id === id).label;

// reasons: as from categorizeWithReasons; each badge then shows its words as a tooltip.
function categoryBadges(cats, reasons) {
  const box = el("span", "badges");
  for (const id of cats) {
    const badge = el("span", "badge badge-" + id, categoryLabel(id));
    if (reasons && reasons[id]) {
      badge.title = "Nyckelord: " + reasons[id].join(", ");
    }
    box.append(badge);
  }
  return box;
}

// The line under a dish that shows the words behind its categories ("Visa nyckelord").
function keywordLine(cats, reasons) {
  const text = cats.length
    ? cats.map(id => categoryLabel(id) + ": " + reasons[id].join(", ")).join(" · ")
    : "Inga nyckelord hittades";
  return el("div", "keywords", text);
}

// The keyword lists in the panel (under "Alla nyckelord").
function buildKeywordList() {
  const box = document.getElementById("keyword-list");
  for (const c of CATEGORIES) {
    const p = el("p");
    p.append(categoryBadges([c.id]), " " + KEYWORDS[c.id].join(", "));
    box.append(p);
  }
  box.append(el("p", "", "Väger tyngre än kött och fisk: " + VEG_PRODUCTS.join(", ")));
  box.append(el("p", "", "Ignoreras: " + IGNORED_WORDS.join(", ")));
  box.append(el("p", "", "Restaurangens egen märkning (KÖTT, FISK, VEG...) går först. Med \"eller\" i texten " +
    "får rätten alla kategorier som hittas, annars går kött och fisk före vegetariskt."));
}

// A row for a dish of today's menu. restaurantName: shown above the dish (in the favorites).
function dishRow(dish, restaurantName) {
  const { item, cats, known } = dish;
  const li = el("li");
  li.dataset.cats = cats.join(" ");
  li.dataset.dish = dishKey(known.restaurant, known.name);
  const star = el("button", "star");
  star.type = "button";
  star.addEventListener("click", () => toggleFavorite(known));
  const info = el("div", "dish");
  const label = [restaurantName, item.category].filter(Boolean).join(" · ");
  if (label) {
    info.append(el("div", "cat", label));
  }
  const name = el("div", "name", item.name);
  name.append(categoryBadges(cats, dish.reasons));
  info.append(name);
  if (item.desc) {
    info.append(el("div", "desc", item.desc));
  }
  info.append(keywordLine(cats, dish.reasons));
  li.append(star, info, el("div", "price", item.price));
  showFavorite(li, !!known.favorite);
  return li;
}

// Fetches and shows the menu of a restaurant; entry.dishes gets today's dishes
// ({ item, cats, reasons, known }), empty when the restaurant has no lunch today.
async function showRestaurant(r, entry, now) {
  const section = entry.section;
  entry.state = "loading";
  entry.dishes = [];
  const head = el("h2");
  const link = el("a", "", r.name);
  link.href = r.url;
  link.target = "_blank";
  link.rel = "noopener";
  head.append(link);
  const loading = el("div", "loading", "Hämtar meny …");
  section.replaceChildren(head, loading);

  const site = siteFor(r);
  let menu;
  try {
    menu = site.parse(await fetchDocument(r.url));
  } catch (e) {
    loading.replaceWith(el("div", "note error", "Kunde inte hämta menyn (" + e.message + ")."));
    entry.state = "error";
    updateSummary();
    return;
  }
  loading.remove();
  entry.state = "done";

  section.append(el("div", "meta", [menu.period, menu.info].filter(Boolean).join(" · ")));
  const weekday = now.getDay() || 7;
  const servesToday = !site.days || site.days.includes(weekday);
  if (!servesToday) {
    section.append(el("div", "note", "Ingen lunch idag. Menyn nedan gäller serveringsdagarna."));
  } else if (menu.week && menu.week !== isoWeek(now)) {
    section.append(el("div", "note", "Menyn gäller vecka " + menu.week + ", inte denna vecka."));
  }

  const count = menu.groups.reduce((n, g) => n + g.items.length, 0);
  if (!count) {
    section.append(el("div", "note error", "Hittade inga rätter på sidan; sidans upplägg har kanske ändrats."));
    updateSummary();
    return;
  }
  for (const group of menu.groups) {
    if (!group.items.length) {
      continue;
    }
    const box = el("div", "dish-group");
    if (group.title && menu.groups.length > 1) {
      box.append(el("div", "group", group.title));
    }
    const list = el("ul");
    for (const item of group.items) {
      const dish = { item, ...categorizeWithReasons(item), known: recordDish(r.url, item.name) };
      if (servesToday) {
        entry.dishes.push(dish);
      }
      list.append(dishRow(dish));
    }
    box.append(list);
    section.append(box);
  }
  section.append(el("div", "empty no-match", "Inga rätter i de valda kategorierna."));
  updateSummary();
}

// The counts next to the restaurants and categories, and today's favorites at the top.
// Category counts and favorites cover the checked restaurants.
function updateSummary() {
  const shown = restaurants.filter(r => !hidden.has(r.url) && sections.has(r.url));
  for (const r of restaurants) {
    const entry = sections.get(r.url);
    if (entry && entry.count) {
      entry.count.textContent = entry.state === "done" ? String(entry.dishes.length)
        : entry.state === "error" ? "–" : "…";
    }
  }
  const today = shown.flatMap(r => sections.get(r.url).dishes.map(dish => ({ r, dish })));
  for (const c of CATEGORIES) {
    categoryCounts.get(c.id).textContent = String(today.filter(t => t.dish.cats.includes(c.id)).length);
  }
  const favorites = today.filter(t => t.dish.known.favorite);
  const list = el("ul");
  favorites.forEach(t => list.append(dishRow(t.dish, t.r.name)));
  const section = document.getElementById("favorites");
  section.replaceChildren(el("h2", "", "Dina favoriter idag"), list);
  applyCategoryFilter();
}

// Hides dishes whose categories are all unchecked; dishes without a category are always shown.
function applyCategoryFilter() {
  for (const li of document.querySelectorAll("main li")) {
    const cats = li.dataset.cats.split(" ").filter(Boolean);
    li.hidden = cats.length > 0 && cats.every(id => hiddenCategories.has(id));
  }
  for (const box of document.querySelectorAll(".dish-group")) {
    box.hidden = !box.querySelector("li:not([hidden])");
  }
  for (const section of document.querySelectorAll("#restaurants section")) {
    const note = section.querySelector(".no-match");
    if (note) {
      note.hidden = !!section.querySelector("li:not([hidden])");
    }
  }
  const favorites = document.getElementById("favorites");
  favorites.hidden = !favorites.querySelector("li:not([hidden])");
  writeHidden(HIDDEN_CATEGORIES_KEY, hiddenCategories);
  showActiveFilters();
}

// The number on the Filter button: unchecked restaurants and categories, since the panel is
// usually closed and a filter is easy to forget.
function showActiveFilters() {
  const count = restaurants.filter(r => hidden.has(r.url)).length +
    CATEGORIES.filter(c => hiddenCategories.has(c.id)).length;
  const badge = document.getElementById("filter-active");
  badge.hidden = !count;
  badge.textContent = String(count);
  document.getElementById("panel-toggle").title = count ? count + " filter avbockade" : "";
}

// Kept in this browser: the restaurants (URLs) and categories (ids) that the filters hide, and
// a restaurant list that could not be written to restaurants.js yet.
const PENDING_KEY = "lunch.pendingRestaurants";
const HIDDEN_KEY = "lunch.hiddenUrls";
const HIDDEN_CATEGORIES_KEY = "lunch.hiddenCategories";
const SHOW_KEYWORDS_KEY = "lunch.showKeywords";

function readStored(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value === null ? fallback : value;
  } catch (e) {
    return fallback;
  }
}

function writeStored(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    // Not stored; the page still works until it is closed.
  }
}

function writeHidden(key, set) {
  writeStored(key, [...set]);
}

// The restaurant list (window.RESTAURANT_LIST) and the dish list (window.DISH_LIST) are read from
// restaurants.js next to this page. Changes are written back there with the File System Access API
// (Chrome, Edge): the file is picked once, its handle is kept in IndexedDB, and Chrome may ask
// again for permission in a new session. Lists that could not be written are kept in this browser
// (PENDING_KEY, { restaurants, dishes }) until they are.
const fileList = Array.isArray(window.RESTAURANT_LIST) ? window.RESTAURANT_LIST : null;
const fileDishes = Array.isArray(window.DISH_LIST) ? window.DISH_LIST : [];
const canWriteFile = "showSaveFilePicker" in window;

function readData() {
  let pending = readStored(PENDING_KEY, null);
  if (Array.isArray(pending)) {
    pending = { restaurants: pending, dishes: fileDishes }; // stored before there were dishes
  }
  const file = { restaurants: fileList || DEFAULT_RESTAURANTS, dishes: fileDishes };
  if (pending && (JSON.stringify(pending.restaurants) !== JSON.stringify(fileList) ||
      JSON.stringify(pending.dishes) !== JSON.stringify(fileDishes))) {
    return pending;
  }
  writeStored(PENDING_KEY, null);
  return { restaurants: [...file.restaurants], dishes: file.dishes.map(d => ({ ...d })) };
}

function handleStore(mode, request) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open("lunch", 1);
    open.onupgradeneeded = () => open.result.createObjectStore("handles");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      try {
        const tx = open.result.transaction("handles", mode);
        const result = request(tx.objectStore("handles"));
        tx.oncomplete = () => resolve(result.result);
        tx.onerror = () => reject(tx.error);
      } catch (e) {
        reject(e);
      }
    };
  });
}

// False when the file behind a stored handle has been moved, renamed or deleted.
async function fileExists(handle) {
  try {
    await handle.getFile();
    return true;
  } catch (e) {
    return e.name !== "NotFoundError";
  }
}

function forgetHandle() {
  return handleStore("readwrite", s => s.delete("restaurants")).catch(() => null);
}

// The handle of restaurants.js with write permission, or null (no support, or cancelled).
// Call it before anything else in a click handler: the dialogs need the click.
async function fileHandle() {
  if (!canWriteFile) {
    return null;
  }
  try {
    const stored = await handleStore("readonly", s => s.get("restaurants")).catch(() => null);
    if (stored && (await stored.requestPermission({ mode: "readwrite" })) === "granted") {
      if (await fileExists(stored)) {
        return stored;
      }
      await forgetHandle(); // moved or deleted: ask for it again below
    }
    const handle = await window.showSaveFilePicker({
      id: "lunch-restaurants",
      suggestedName: "restaurants.js",
      types: [{ description: "Restauranglista", accept: { "text/javascript": [".js"] } }],
    });
    if (handle.name !== "restaurants.js" && !confirm("Listan läses bara från restaurants.js bredvid lunch.html. Spara ändå till " + handle.name + "?")) {
      return null;
    }
    await handleStore("readwrite", s => s.put(handle, "restaurants")).catch(() => null);
    return handle;
  } catch (e) {
    return null;
  }
}

// The stored handle if this page may already write to it (no dialog needed), else null.
async function grantedHandle() {
  if (!canWriteFile) {
    return null;
  }
  try {
    const stored = await handleStore("readonly", s => s.get("restaurants"));
    return stored && (await stored.queryPermission({ mode: "readwrite" })) === "granted" &&
      (await fileExists(stored)) ? stored : null;
  } catch (e) {
    return null;
  }
}

const js = value => JSON.stringify(value);

function fileText(restaurantList, dishList) {
  return "// Restaurants shown by lunch.html: edit by hand, or use Lägg till / Ta bort on the page.\n" +
    "window.RESTAURANT_LIST = [\n" +
    restaurantList.map(r => "  { name: " + js(r.name) + ", url: " + js(r.url) + " },\n").join("") +
    "];\n\n" +
    "// Dishes seen on the menus (added by the page); favorite: marked with the star.\n" +
    "window.DISH_LIST = [\n" +
    dishList.map(d => "  { restaurant: " + js(d.restaurant) + ", name: " + js(d.name) +
      ", firstSeen: " + js(d.firstSeen) + (d.favorite ? ", favorite: true" : "") + " },\n").join("") +
    "];\n";
}

let saving = Promise.resolve();

// Writes both lists to restaurants.js, or keeps them in this browser when that is not possible.
// Writes run one after the other.
function saveData(handle) {
  saving = saving.then(() => writeData(handle));
  return saving;
}

async function writeData(handle) {
  const data = { restaurants, dishes };
  if (handle) {
    try {
      const writable = await handle.createWritable();
      await writable.write(fileText(restaurants, dishes));
      await writable.close();
      writeStored(PENDING_KEY, null);
      showFileStatus("Sparat i " + handle.name + ".");
      return;
    } catch (e) {
      writeStored(PENDING_KEY, data);
      if (e.name === "NotFoundError") {
        await forgetHandle();
        showFileStatus("Hittade inte " + handle.name + " (flyttad?). Välj filen igen med Spara till fil.");
      } else {
        showFileStatus("Kunde inte spara i " + handle.name + " (" + e.message + "); ändringen finns bara i webbläsaren.");
      }
      return;
    }
  }
  writeStored(PENDING_KEY, data);
  showFileStatus(canWriteFile
    ? "Ändringar är inte sparade i restaurants.js ännu; de finns i webbläsaren."
    : "Webbläsaren kan inte spara till fil; ändringar finns bara här. Redigera restaurants.js för hand.");
}

function showFileStatus(message) {
  const pending = readStored(PENDING_KEY, null) !== null;
  document.getElementById("file-status").textContent = message ||
    (pending ? "Det finns ändringar som inte är sparade i restaurants.js."
      : fileList ? "Listorna läses från restaurants.js."
        : "restaurants.js saknas; den inbyggda listan visas.");
  document.getElementById("save-file").hidden = !(pending && canWriteFile);
}

async function saveToFile() {
  const handle = await fileHandle();
  if (handle) {
    await saveData(handle);
  }
}

// Dishes are identified by restaurant and name (case and spacing ignored).
const dishKey = (restaurant, name) => restaurant + " " + clean(name).toLowerCase();

function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

let newDishTimer = null;

// The dish in the list, added (and saved shortly after, together with others) if it is new.
function recordDish(restaurant, name) {
  const key = dishKey(restaurant, name);
  let dish = dishes.find(d => dishKey(d.restaurant, d.name) === key);
  if (!dish) {
    dish = { restaurant, name: clean(name), firstSeen: today() };
    dishes.push(dish);
    clearTimeout(newDishTimer);
    newDishTimer = setTimeout(async () => saveData(await grantedHandle()), 1000);
  }
  return dish;
}

// Marks or unmarks a favorite, on every row showing the dish, and saves.
async function toggleFavorite(dish) {
  dish.favorite = !dish.favorite;
  if (!dish.favorite) {
    delete dish.favorite;
  }
  const key = dishKey(dish.restaurant, dish.name);
  document.querySelectorAll("#restaurants li").forEach(li => {
    if (li.dataset.dish === key) {
      showFavorite(li, !!dish.favorite);
    }
  });
  const handle = fileHandle(); // started first: the file dialog needs the click
  updateSummary();
  await saveData(await handle);
}

function showFavorite(li, favorite) {
  li.classList.toggle("favorite", favorite);
  const star = li.querySelector(".star");
  star.textContent = favorite ? "★" : "☆";
  star.setAttribute("aria-pressed", String(favorite));
  star.title = favorite ? "Ta bort från favoriter" : "Markera som favorit";
}

const data = readData();
let restaurants = data.restaurants;
const dishes = data.dishes;
const hidden = new Set(readStored(HIDDEN_KEY, []));
const hiddenCategories = new Set(readStored(HIDDEN_CATEGORIES_KEY, []));
// restaurant URL -> { section, loaded, state, dishes, count }; count: the count in the filter.
const sections = new Map();
const categoryCounts = new Map(); // category id -> its count in the filter

// Shows the selected restaurants. Every menu is fetched (also of unchecked restaurants), so the
// filter can show how many dishes each restaurant has today.
function applyFilter() {
  const now = new Date();
  for (const r of restaurants) {
    const entry = sections.get(r.url);
    entry.section.hidden = hidden.has(r.url);
    if (!entry.loaded) {
      entry.loaded = true;
      showRestaurant(r, entry, now);
    }
  }
  const empty = document.getElementById("empty");
  empty.textContent = restaurants.length ? "Ingen restaurang vald." : "Inga restauranger. Lägg till en webbadress till vänster.";
  empty.hidden = restaurants.some(r => !hidden.has(r.url));
  writeHidden(HIDDEN_KEY, hidden);
  updateSummary();
}

// A checkbox that is checked while key is not in set; content is the label text or nodes.
function filterCheckbox(set, key, onChange, ...content) {
  const label = el("label");
  const box = el("input");
  box.type = "checkbox";
  box.checked = !set.has(key);
  box.addEventListener("change", () => {
    if (box.checked) {
      set.delete(key);
    } else {
      set.add(key);
    }
    onChange();
  });
  label.append(box, ...content);
  return label;
}

// Builds the restaurant checkboxes, the drop-down and a section per restaurant. Sections of
// restaurants still in the list are kept, so their menus are not fetched again.
function buildRestaurants() {
  const filter = document.getElementById("filter");
  const select = document.getElementById("restaurant-select");
  const container = document.getElementById("restaurants");
  filter.replaceChildren();
  select.replaceChildren();
  for (const [url, entry] of sections) {
    if (!restaurants.some(r => r.url === url)) {
      entry.section.remove();
      sections.delete(url);
      hidden.delete(url);
    }
  }
  for (const r of restaurants) {
    if (!sections.has(r.url)) {
      sections.set(r.url, { section: el("section"), loaded: false, state: "loading", dishes: [] });
    }
    const entry = sections.get(r.url);
    entry.count = el("span", "count");
    filter.append(filterCheckbox(hidden, r.url, applyFilter, r.name, entry.count));
    const option = el("option", "", r.name);
    option.value = r.url;
    select.append(option);
    container.append(entry.section);
  }
  document.getElementById("delete").disabled = !restaurants.length;
  applyFilter();
}

function buildCategoryFilter() {
  const categoryFilter = document.getElementById("category-filter");
  for (const c of CATEGORIES) {
    const count = el("span", "count");
    categoryCounts.set(c.id, count);
    categoryFilter.append(filterCheckbox(hiddenCategories, c.id, applyCategoryFilter, categoryBadges([c.id]), count));
  }
}

function setAll(checked) {
  document.querySelectorAll("#filter input").forEach(box => {
    box.checked = checked;
  });
  restaurants.forEach(r => (checked ? hidden.delete(r.url) : hidden.add(r.url)));
  applyFilter();
}

async function deleteRestaurant() {
  const url = document.getElementById("restaurant-select").value;
  const r = restaurants.find(x => x.url === url);
  if (!r) {
    return;
  }
  const handle = await fileHandle();
  if (confirm("Ta bort " + r.name + "?")) {
    restaurants = restaurants.filter(x => x !== r);
    buildRestaurants();
    await saveData(handle);
  }
}

// The restaurant's name: from the defaults, else og:site_name, else the first part of the title,
// else the host. doc is Markdown text for a site with text headers.
function siteName(doc, url) {
  const known = DEFAULT_RESTAURANTS.find(r => r.url === url);
  if (known) {
    return known.name;
  }
  const isText = typeof doc === "string";
  const meta = isText ? null : doc.querySelector('meta[property="og:site_name"]');
  const fromMeta = meta ? clean(meta.content || "") : "";
  const title = isText ? (doc.match(/^Title: (.*)$/m) || ["", ""])[1] : doc.title;
  const fromTitle = clean((title || "").split(/\s[|–—-]\s/)[0]);
  const name = fromMeta || fromTitle || new URL(url).hostname.replace(/^www\./, "");
  return name.length > 40 ? new URL(url).hostname.replace(/^www\./, "") : name;
}

async function addRestaurant(event) {
  event.preventDefault();
  const input = document.getElementById("url");
  const status = document.getElementById("add-status");
  let url;
  try {
    url = new URL(input.value.trim().match(/^https?:\/\//i) ? input.value.trim() : "https://" + input.value.trim());
  } catch (e) {
    url = null;
  }
  if (!url || !/^https?:$/.test(url.protocol) || !url.hostname.includes(".")) {
    status.textContent = "Ogiltig webbadress.";
    return;
  }
  url = url.href;
  if (restaurants.some(r => r.url === url)) {
    status.textContent = "Finns redan i listan.";
    return;
  }
  const button = document.getElementById("add");
  button.disabled = true;
  const handle = await fileHandle();
  status.textContent = "Hämtar sidan …";
  let name;
  try {
    name = siteName(await fetchDocument(url), url);
  } catch (e) {
    status.textContent = "Kunde inte hämta sidan (" + e.message + ").";
    button.disabled = false;
    return;
  }
  button.disabled = false;
  status.textContent = "";
  input.value = "";
  restaurants = [...restaurants, { name, url }];
  hidden.delete(url);
  buildRestaurants();
  document.getElementById("restaurant-select").value = url;
  await saveData(handle);
}

function showDate() {
  const now = new Date();
  const date = now.toLocaleDateString("sv-SE", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("today").textContent =
    date.charAt(0).toUpperCase() + date.slice(1) + " · vecka " + isoWeek(now);
}

// Fetches the shown menus again; hidden ones are fetched when they are shown.
function load() {
  showDate();
  documents.clear();
  sections.forEach(entry => {
    entry.loaded = false;
  });
  applyFilter();
}

document.getElementById("reload").addEventListener("click", load);
document.getElementById("all").addEventListener("click", () => setAll(true));
document.getElementById("none").addEventListener("click", () => setAll(false));
document.getElementById("delete").addEventListener("click", deleteRestaurant);
document.getElementById("add-form").addEventListener("submit", addRestaurant);
document.getElementById("save-file").addEventListener("click", saveToFile);
// The panel with the filters is closed when the page opens; the Filter button opens and closes it.
document.getElementById("panel-toggle").addEventListener("click", () => {
  const panel = document.getElementById("panel");
  panel.hidden = !panel.hidden;
  document.getElementById("panel-toggle").setAttribute("aria-expanded", String(!panel.hidden));
});
showDate();
showFileStatus();
buildCategoryFilter();
buildKeywordList();
const showKeywords = document.getElementById("show-keywords");
showKeywords.checked = readStored(SHOW_KEYWORDS_KEY, false) === true;
document.body.classList.toggle("show-keywords", showKeywords.checked);
showKeywords.addEventListener("change", () => {
  document.body.classList.toggle("show-keywords", showKeywords.checked);
  writeStored(SHOW_KEYWORDS_KEY, showKeywords.checked);
});
buildRestaurants();
</script>
